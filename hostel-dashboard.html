<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management Dashboard</title>
    <link rel="stylesheet" href="hostel-dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <h1>🏠 Hostel Management System</h1>
        <h2>Dashboard</h2>

        <div class="stats-grid">
            <div class="card"><div class="number">5</div><div class="label">STUDENTS</div><div class="link">FULL DETAILS +</div><div class="extra">REGISTERED COMPLAINTS · CLOSED COMPLAINTS</div><div class="see-all">SEE ALL +</div></div>
            <div class="card"><div class="number">6</div><div class="label">TOTAL ROOMS</div><div class="link">FULL DETAILS +</div><div class="see-all">SEE ALL +</div></div>
            <div class="card"><div class="number">7</div><div class="label">TOTAL COURSES</div><div class="link">FULL DETAILS +</div><div class="see-all">SEE ALL +</div></div>
            <div class="card"><div class="number">1</div><div class="label">NEW COMPLAINTS</div><div class="link">FULL DETAILS +</div><div class="see-all">SEE ALL +</div></div>
            <div class="card"><div class="number">1</div><div class="label">IN PROCESS COMPLAINTS</div><div class="link">FULL DETAILS +</div><div class="see-all">SEE ALL +</div></div>
        </div>

        <div class="account">📁 Account</div>
    </div>
</body>
</html>
