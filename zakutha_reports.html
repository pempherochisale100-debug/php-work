        <main>
            <h1>ZAKUTHA TOBACCO ESTATE</h1>
            <h2>Upload work and worker reports</h2>
            <div class="form-grid">
                <div>
                    <label>Worker's first name</label>
                    <input type="text" name="first_name" value=" " placeholder="enter your first name"/>
                </div>
                <div>
                    <label>Worker's last name</label>
                    <input type="text" name="last_name" value=" " placeholder="enter your last name"/>
                </div>
                <div>
                    <label>Worker ID number</label>

                </div>
                <div>
                    <label>Age</label>
                    <input type="number" name="age" value="">
                </div>
                <div>
                    <label>Gender</label>
                    <select name="gender" >
                        <option>MALE</option>
                        <option>FEMALE</option>
                        <option>RATHER NOT TO SAY</option>
                    </select>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" name="email" value="" placeholder="enter your email address "/>
                </div>
                <div>
                    <label>Report Type</label>
                    <select>
                        <option>absent report</option>
                        <option>work winding-up </option>
                        <option>work resuming </option>
                        <option>breaking </option>
                    </select>
                </div>
                <div class="full-width">
                    <label>Report File</label>
                    <button>Choose File</button> 
                    <span>No file chosen</span>
                </div>
            </div>
            <button class="upload-btn">Upload Report</button>
            <h3>Recent Uploaded Reports</h3>
