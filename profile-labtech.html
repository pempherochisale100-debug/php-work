<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vector Hospital | Profile</title>
    <link rel="stylesheet" href="profile-labtech.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-hospital"></i> VECTOR HOSPITAL</h1>
        <div class="profile-card">
            <h2>Profile Information</h2>
            <p><strong>Arif Hossain</strong><br>Lab Technician</p>
            <div class="info-row"><span>Full Name:</span> Arif Hossain</div>
            <div class="info-row"><span>Gender:</span> Male</div>
            <div class="info-row"><span>Username:</span> staff</div>
            <div class="info-row"><span>Email:</span> arifhossain@gmail.com</div>
            <div class="info-row"><span>Password:</span> ******</div>
        </div>
        <div class="update-section">
            <h3>Update Profile Picture</h3>
            <button>Choose File</button> <span>No file chosen</span>
            <button class="update-photo">Update Profile Picture</button>
        </div>
        <div class="update-section">
            <h3>Change Username</h3>
            <p>Current Username: staff</p>
            <input placeholder="New Username" value="staff">
            <button>Change Username</button>
        </div>
        <div class="update-section">
            <h3>Change Password</h3>
            <input type="password" placeholder="New Password">
            <button>Change Password</button>
        </div>
    </div>
</body>
</html>
